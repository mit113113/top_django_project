{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Парфюмерный магазин Parfum — ароматы на каждый день и особые случаи.">
    <title>{% block title %}Parfum — магазин ароматов{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'product/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="">PERFUME<span>.</span></a>
        <nav class="main-nav" aria-label="Основная навигация">
            <a href="">Каталог</a>
            <a href="#about">О магазине</a>
        </nav>
        <span class="header-note">Искусство быть собой</span>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" id="about">
        <a class="logo footer-logo" href="">PERFUME<span>.</span></a>
        <p>Подборка ароматов для любого настроения.</p>
    </footer>
</body>
</html>
